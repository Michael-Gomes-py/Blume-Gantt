<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Blume Project Management. Cronograma Gantt empresarial.">
<!-- Biblioteca Excel com suporte a estilos e cores -->
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<title>Blume | Gestão de Projetos</title>
<!-- V16: autosave reforçado -->
<style>
:root{--task-col:clamp(220px,20vw,360px);--owner-col:clamp(130px,10vw,180px);--status-col:clamp(125px,9vw,160px);
  --bg:#080b0f;--surface:#10151b;--surface2:#151b22;--line:#28313b;
  --text:#f4f7f8;--muted:#9ba8b4;--green:#ff00ff;--green2:#e000e0;
  --cyan:#4ee1c1;--danger:#ff5c68;--warning:#ffc857;--shadow:0 18px 45px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%;overflow-x:hidden;font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at top right,#220022 0,#080b0f 42%);color:var(--text)}
button,input,select{font:inherit}
button{cursor:pointer}
.topbar{position:sticky;top:0;z-index:20;background:rgba(8,11,15,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:14px}
.logo-container{display:flex;align-items:center;justify-content:center;background:#000000;border:1px solid rgba(255,0,255,.3);border-radius:12px;padding:6px;box-shadow:0 0 18px rgba(255,0,255,.25);flex-shrink:0}
.brand h1{margin:0;font-size:1.25rem;letter-spacing:4px;font-weight:900;color:#ffffff}.brand p{margin:1px 0 0;color:var(--muted);font-size:.72rem;letter-spacing:1px}
.status{color:var(--green);font-size:.78rem;border:1px solid rgba(255,0,255,.3);padding:7px 11px;border-radius:999px;background:rgba(255,0,255,.07)}
main{width:100%;max-width:none;padding:clamp(14px,2vw,30px)}
.hero{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}.hero h2{margin:0;font-size:2rem;letter-spacing:-.04em}.hero p{margin:7px 0 0;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.card{background:linear-gradient(145deg,rgba(21,27,34,.96),rgba(12,16,21,.96));border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.kpi{padding:17px}.kpi small{color:var(--muted);text-transform:uppercase;font-size:.68rem;letter-spacing:.08em}.kpi strong{display:block;font-size:1.55rem;margin-top:7px}
.toolbar{padding:13px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#151b22;color:var(--text);padding:9px 13px;border-radius:99px;transition:.18s}.btn:hover{border-color:#4a5968;transform:translateY(-1px)}
.btn.primary{background:var(--green);border-color:var(--green);color:#ffffff;font-weight:800}.btn.primary:hover{background:#e000e0}
.btn.danger:hover{border-color:var(--danger);color:var(--danger)}
select,input{background:#0d1217;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
select:focus,input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(255,0,255,.15)}
label{font-size:.78rem;color:var(--muted)}

/* Gantt Table & Colunas Fixas */
.gantt-card{width:100%;overflow:hidden}
.gantt-wrap{width:100%;height:clamp(420px,68vh,900px);overflow:auto;position:relative}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
th,td{border-right:1px solid #202832;border-bottom:1px solid #202832;padding:6px 8px;text-align:center;font-size:.78rem;height:42px;background:#10151b}
thead th{position:sticky;top:0;z-index:10;background:#171e26;color:#aebbc6;font-size:.68rem;text-transform:uppercase;white-space:nowrap}

/* Larguras das Colunas */
.col-task{width:280px;min-width:280px}
.col-owner{width:140px;min-width:140px}
.col-status{width:130px;min-width:130px}
.col-date{width:115px;min-width:115px}
.col-days{width:65px;min-width:65px}
.col-end{width:100px;min-width:100px}
.col-actions{width:50px;min-width:50px}

.day{width:36px;min-width:36px;padding:0}.day:first-of-type{border-left:2px solid #3a4652}
.bar{background:rgba(255,0,255,.8)!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.bar.progress-bar{background:rgba(78,225,193,.75)!important}
.bar.todo-bar{background:rgba(107,114,128,.6)!important}
.start{border-radius:6px 0 0 6px}.finish{border-radius:0 6px 6px 0}.today{box-shadow:inset 2px 0 0 var(--cyan),inset -2px 0 0 var(--cyan)}

/* Form Inputs */
.task-input{width:100%;background:transparent;border:1px solid transparent;color:var(--text);font-weight:500}
.task-input:hover,.task-input:focus{border-color:var(--line);background:#0d1217}
.owner-select,.status-select{width:100%;border-radius:6px;padding:4px 6px;font-size:.75rem}
.status-select.done{border-color:rgba(255,0,255,.5);color:var(--green);background:rgba(255,0,255,.08)}
.status-select.progress{border-color:rgba(78,225,193,.5);color:var(--cyan);background:rgba(78,225,193,.05)}
.status-select.todo{border-color:#56616c;color:#c5ced6}
.status-select.cancel{border-color:var(--danger);color:var(--danger)}

.delete{width:28px;height:28px;border-radius:6px;background:transparent;color:var(--muted);border:1px solid var(--line)}
.delete:hover{color:var(--danger);border-color:var(--danger)}
.empty{text-align:center;padding:50px;color:var(--muted)}
.footer{padding:16px;color:var(--muted);font-size:.75rem;text-align:center}
.zoom-info{font-size:.75rem;color:var(--muted);min-width:46px;text-align:center}
.late-badge{color:var(--danger);font-size:.62rem;margin-left:4px;font-weight:bold}
.late-row td{background:rgba(255,92,104,.03)!important}

.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.75);display:grid;place-items:center;padding:20px}
.modal{width:min(600px,100%);background:#11171e;border:1px solid #35414c;border-radius:16px;padding:22px}
.modal h3{margin:0 0 15px}.project-list{display:grid;gap:8px;margin:15px 0}.project-item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px;background:#0c1116;border:1px solid #27313b;border-radius:8px}.project-item.active{border-color:var(--green)}

@media(max-width:800px){.kpis{grid-template-columns:repeat(2,1fr)}}

/* GANTT: Colunas fixas durante rolagem horizontal */
#ganttWrap{position:relative;overflow:auto;isolation:isolate}
#ganttTable{border-collapse:separate !important;border-spacing:0;min-width:max-content}
#ganttTable th,#ganttTable td{box-sizing:border-box}

#ganttTable .sticky-1,
#ganttTable .sticky-2,
#ganttTable .sticky-3,
#ganttTable .sticky-4,
#ganttTable .sticky-5,
#ganttTable .sticky-6,
#ganttTable .sticky-7{
  position:sticky !important;
  z-index:30 !important;
  background:#10161d !important;
  background-clip:padding-box;
}

#ganttTable .sticky-1{left:0}
#ganttTable .sticky-2{left:var(--w1,280px)}
#ganttTable .sticky-3{left:calc(var(--w1,280px) + var(--w2,140px))}
#ganttTable .sticky-4{left:calc(var(--w1,280px) + var(--w2,140px) + var(--w3,130px))}
#ganttTable .sticky-5{left:calc(var(--w1,280px) + var(--w2,140px) + var(--w3,130px) + var(--w4,115px))}
#ganttTable .sticky-6{left:calc(var(--w1,280px) + var(--w2,140px) + var(--w3,130px) + var(--w4,115px) + var(--w5,60px))}
#ganttTable .sticky-7{left:calc(var(--w1,280px) + var(--w2,140px) + var(--w3,130px) + var(--w4,115px) + var(--w5,60px) + var(--w6,115px))}

#ganttTable thead .sticky-1,
#ganttTable thead .sticky-2,
#ganttTable thead .sticky-3,
#ganttTable thead .sticky-4,
#ganttTable thead .sticky-5,
#ganttTable thead .sticky-6,
#ganttTable thead .sticky-7{
  z-index:50 !important;
  background:#171e26 !important;
}

#ganttTable .sticky-7{box-shadow:4px 0 7px rgba(0,0,0,.28)}

#ganttTable .sticky-1 input,
#ganttTable .sticky-4 input[type="date"],
#ganttTable .sticky-2 select,
#ganttTable .sticky-3 select,
#ganttTable .sticky-4 input,
#ganttTable .sticky-5 input,
#ganttTable .sticky-7 button{position:relative;z-index:2}
#ganttTable input[type="date"]{color-scheme:dark;cursor:pointer}
#ganttTable input[type="date"]::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.9;filter:none}

#ganttTable .day{position:relative;z-index:1;min-width:32px}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <!-- LOGO EXATO DA IMAGEM EM SVG VETORIAL -->
    <div class="logo-container">
      <svg width="40" height="46" viewBox="0 0 200 230" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Contorno Hexagonal Externo -->
        <polygon points="100,5 190,57 190,163 100,215 10,163 10,57" stroke="#FF00FF" stroke-width="14" stroke-linejoin="round" fill="none"/>
        
        <!-- Y Central Interno -->
        <line x1="100" y1="110" x2="100" y2="215" stroke="#FF00FF" stroke-width="14" stroke-linecap="round"/>
        <line x1="100" y1="110" x2="10" y2="57" stroke="#FF00FF" stroke-width="14" stroke-linecap="round"/>
        <line x1="100" y1="110" x2="190" y2="57" stroke="#FF00FF" stroke-width="14" stroke-linecap="round"/>
        
        <!-- Bloco Cubo Superior (Seta Superior) -->
        <polyline points="55,31 100,57 145,31" stroke="#FF00FF" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
        
        <!-- Bloco Cubo Esquerdo -->
        <polyline points="10,110 55,136 55,189" stroke="#FF00FF" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
        
        <!-- Bloco Cubo Direito -->
        <polyline points="190,110 145,136 145,189" stroke="#FF00FF" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
      </svg>
    </div>
    <div>
      <h1>B L U M E</h1>
      <p>Project Management System</p>
    </div>
  </div>

</header>

<main>
  <section class="hero">
    <div><h2>Gestão de Projetos</h2><p>Cronograma Gantt empresarial responsivo e integrado.</p></div>
    <div class="status" id="todayDisplay"></div>
  </section>

  <section class="kpis">
    <div class="card kpi"><small>Tarefas</small><strong id="kpiTasks">0</strong></div>
    <div class="card kpi"><small>Período</small><strong id="kpiDays">0 dias</strong></div>
    <div class="card kpi"><small>Responsáveis</small><strong id="kpiOwners">0</strong></div>
    <div class="card kpi"><small>Concluídas</small><strong id="kpiDone">0%</strong></div>
    <div class="card kpi"><small>Atrasadas</small><strong id="kpiLate">0</strong></div>
  </section>

  <section class="card toolbar">
    <div class="group">
      <button class="btn primary" id="addTask">＋ Nova tarefa</button>
      <label for="filterOwner">Responsável</label>
      <select id="filterOwner"></select>
      <label for="filterStatus">Status</label>
      <select id="filterStatus">
        <option value="TODOS">Todos</option>
        <option value="Não iniciada">Não iniciada</option>
        <option value="Em andamento">Em andamento</option>

      </select>
    </div>
    <div class="group">
      <button class="btn" id="fit">Ajustar ao tamanho</button>
      <button class="btn" id="zoomOut">−</button><span class="zoom-info" id="zoomInfo">100%</span><button class="btn" id="zoomIn">＋</button>
      <button class="btn" id="projectManager">Projetos</button>
      <button class="btn primary" id="saveNow">💾 Salvar agora</button>
      <button class="btn" id="downloadBackup">⬇ Baixar backup</button>
      <button class="btn" id="restoreBackup">⬆ Restaurar backup</button>
      <input type="file" id="backupFileInput" accept="application/json,.json" hidden>
      <button class="btn" id="exportExcel">Excel (.xlsx)</button>
      <button class="btn" id="exportImage">Exportar como imagem</button>
      <button class="btn danger" id="reset">Restaurar</button>

  <section class="card gantt-card">
    <div class="gantt-wrap" id="ganttWrap">
      <table id="ganttTable">

          <th class="sticky-2 col-owner">Responsável</th>

          <th class="sticky-5 col-days">Dias</th>
          <th class="sticky-6 col-end">Fim</th>

      </table>
    </div>
  </section>

</main>

<script>
const STORAGE_KEY='blume_gantt_v4';
const PROJECTS_KEY='blume_projects_v2';
const OWNER_OPTIONS=['Liderança','Ryan','Michael','Vinicius','Kauã','Dimitri','Todos'];
const DEFAULT_TASKS=[
 {id:1,name:'Reunião de inicialização de projeto',owner:'Liderança',start:'2026-08-03',duration:2,status:'Concluída',progress:100},
 {id:2,name:'Levantamento de Requisitos do Sistema',owner:'Ryan',start:'2026-08-05',duration:3,status:'Concluída',progress:100},
 {id:3,name:'Aprovação do Plano',owner:'Liderança',start:'2026-08-10',duration:2,status:'Em andamento',progress:50},
 {id:4,name:'Reunião de alinhamento de tarefas',owner:'Liderança',start:'2026-08-10',duration:1,status:'Concluída',progress:100},
 {id:5,name:'Delegação geral das tarefas',owner:'Liderança',start:'2026-08-10',duration:1,status:'Concluída',progress:100},
 {id:6,name:'Estudo do pfSense',owner:'Todos',start:'2026-08-10',duration:90,status:'Em andamento',progress:10},
 {id:7,name:'Estudo específico do pfSense',owner:'Vinicius',start:'2026-08-10',duration:7,status:'Em andamento',progress:60},
 {id:8,name:'Estudo específico do pfSense',owner:'Kauã',start:'2026-08-10',duration:7,status:'Em andamento',progress:60},
 {id:9,name:'Documentação do projeto',owner:'Dimitri',start:'2026-08-24',duration:8,status:'Não iniciada',progress:0},
 {id:10,name:'Auxílio da topologia e endereçamentos',owner:'Michael',start:'2026-08-10',duration:20,status:'Em andamento',progress:35},
 {id:11,name:'Topologia e endereçamentos',owner:'Ryan',start:'2026-09-01',duration:5,status:'Não iniciada',progress:0}
];

let tasks=loadTasks();
let projects=loadProjects();
let activeProject=projects[0]?.id||1;
let zoom=1;

function clone(x){return JSON.parse(JSON.stringify(x))}
let saveTimer=null;
let hasUnsavedChanges=false;

function loadTasks(){
  try{
    const saved=localStorage.getItem(STORAGE_KEY);
    return saved?JSON.parse(saved):clone(DEFAULT_TASKS);
  }catch(err){
    console.warn('Não foi possível ler os dados salvos.',err);
    return clone(DEFAULT_TASKS);
  }
}

function save(){
  hasUnsavedChanges=true;
  const status=document.getElementById('saveStatus');
  if(status)status.textContent='● Salvando...';

  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(tasks));
    hasUnsavedChanges=false;
    if(status)status.textContent='● Dados sincronizados';
  }catch(err){
    console.error('Erro ao salvar o projeto.',err);
    if(status)status.textContent='● Erro ao salvar';
  }
}

function queueSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(save,120);
}

function forceSave(){
  clearTimeout(saveTimer);
  if(hasUnsavedChanges)save();
}

function manualSave(){
  clearTimeout(saveTimer);
  save();
  const status=document.getElementById('saveStatus');
  if(status){
    status.textContent='✓ Dados salvos agora';
    clearTimeout(window.__saveFeedbackTimer);
    window.__saveFeedbackTimer=setTimeout(()=>{status.textContent='● Dados sincronizados'},1800);
  }
}

function downloadBackup(){
  forceSave();
  const backup={
    app:'Blume Project Management',
    version:'V18',
    exportedAt:new Date().toISOString(),
    tasks:clone(tasks),
    projects:clone(projects),
    activeProject
  };
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');
  const stamp=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const fileName=`Blume_Backup_${stamp.getFullYear()}-${pad(stamp.getMonth()+1)}-${pad(stamp.getDate())}_${pad(stamp.getHours())}-${pad(stamp.getMinutes())}.json`;
  link.href=url;
  link.download=fileName;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);

  const status=document.getElementById('saveStatus');
  if(status){
    status.textContent='✓ Backup baixado';
    clearTimeout(window.__saveFeedbackTimer);
    window.__saveFeedbackTimer=setTimeout(()=>{status.textContent='● Dados sincronizados'},2200);
  }
}

function restoreBackup(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const backup=JSON.parse(reader.result);
      if(!backup || typeof backup!=='object')throw new Error('Formato inválido.');
      if(!Array.isArray(backup.tasks))throw new Error('O backup não contém uma lista de tarefas válida.');
      if(backup.projects!==undefined && !Array.isArray(backup.projects))throw new Error('A lista de projetos do backup é inválida.');

      const cleanTasks=backup.tasks.map(t=>({
        id:Number(t.id),
        name:String(t.name??'Nova etapa / tarefa'),
        owner:String(t.owner??'Liderança'),
        start:normalizeStart(t.start) || iso(new Date()),
        duration:Math.max(1,Math.min(3650,parseInt(t.duration,10)||1)),
        status:['Não iniciada','Em andamento','Concluída','Cancelada'].includes(t.status)?t.status:'Não iniciada',
        progress:Math.max(0,Math.min(100,Number(t.progress)||0))
      })).filter(t=>Number.isFinite(t.id));

      if(!cleanTasks.length)throw new Error('O backup não possui tarefas válidas.');

      if(!confirm(`Restaurar ${cleanTasks.length} tarefa(s) do backup? Os dados atuais serão substituídos.`))return;

      tasks=cleanTasks;
      if(Array.isArray(backup.projects) && backup.projects.length){
        projects=backup.projects.map(p=>({
          id:Number(p.id),
          name:String(p.name??'Projeto'),
          description:String(p.description??'')
        })).filter(p=>Number.isFinite(p.id));
        if(!projects.length)projects=[{id:1,name:'Projeto Blume',description:'Cronograma principal'}];
      }

      activeProject=Number(backup.activeProject)||projects[0]?.id||1;
      if(!projects.some(p=>p.id===activeProject))activeProject=projects[0]?.id||1;

      localStorage.setItem(STORAGE_KEY,JSON.stringify(tasks));
      localStorage.setItem(PROJECTS_KEY,JSON.stringify(projects));
      hasUnsavedChanges=false;
      renderFilter();
      render();

      const status=document.getElementById('saveStatus');
      if(status){
        status.textContent='✓ Backup restaurado';
        clearTimeout(window.__saveFeedbackTimer);
        window.__saveFeedbackTimer=setTimeout(()=>{status.textContent='● Dados sincronizados'},2500);
      }
    }catch(err){
      console.error('Erro ao restaurar backup.',err);
      alert('Não foi possível restaurar o backup. Verifique se o arquivo é um backup válido do Blume.');
    }
  };
  reader.onerror=()=>alert('Não foi possível ler o arquivo de backup.');
  reader.readAsText(file);
}

function loadProjects(){try{return JSON.parse(localStorage.getItem(PROJECTS_KEY))||[{id:1,name:'Projeto Blume',description:'Cronograma principal'}]}catch{return [{id:1,name:'Projeto Blume',description:'Cronograma principal'}]}}
function parseDate(s){
  if(!s || typeof s!=='string') return null;
  s=s.trim();
  let m=/(^\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if(!m){
    const br=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s);
    if(br)m=[null,br[3],br[2],br[1]];
  }
  if(!m) return null;
  const y=Number(m[1]),mo=Number(m[2]),day=Number(m[3]);
  const d=new Date(y,mo-1,day);
  if(Number.isNaN(d.getTime()) || d.getFullYear()!==y || d.getMonth()!==mo-1 || d.getDate()!==day)return null;
  return d;
}
function normalizeStart(value){
  value=String(value??'').trim();
  const d=parseDate(value);
  return d?iso(d):null;
}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function fmt(d){return d?d.toLocaleDateString('pt-BR'):''}
function iso(d){
  if(!d || Number.isNaN(d.getTime())) return '';
  return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
}
function endDate(t){const d=parseDate(t.start);return d?addDays(d,Math.max(0,(Number(t.duration)||1)-1)):null}
function filtered(){const o=document.getElementById('filterOwner').value,s=document.getElementById('filterStatus').value;return tasks.filter(t=>(!o||o==='TODOS'||t.owner===o)&&(!s||s==='TODOS'||t.status===s))}
function dateRange(list){const valid=list.filter(t=>parseDate(t.start));if(!valid.length)return null;let a=new Date(Math.min(...valid.map(t=>parseDate(t.start))));let b=new Date(Math.max(...valid.map(t=>endDate(t))));a=addDays(a,-2);b=addDays(b,2);return {start:a,end:b,days:Math.round((b-a)/86400000)+1}}
function owners(){return [...new Set([...OWNER_OPTIONS,...tasks.map(t=>t.owner).filter(Boolean)])]}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function isLate(t){const n=new Date();n.setHours(0,0,0,0);return t.status!=='Concluída'&&t.status!=='Cancelada'&&endDate(t)<n}

function renderFilter(){
  const s=document.getElementById('filterOwner'),current=s.value||'TODOS';
  s.innerHTML='<option value="TODOS">Todos os responsáveis</option>'+owners().map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('');
  if([...s.options].some(x=>x.value===current))s.value=current;
}

function render(){
 const list=filtered(),range=dateRange(list)||{start:new Date(),end:addDays(new Date(),29),days:30};
 const head=document.getElementById('ganttHead');
 while(head.children.length>7)head.removeChild(head.lastChild);
 for(let i=0;i<range.days;i++){
   const d=addDays(range.start,i),th=document.createElement('th');
   th.className='day';th.textContent=String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
   if(d.toDateString()===new Date().toDateString())th.classList.add('today');
   head.appendChild(th);
 }
 const body=document.getElementById('ganttBody');body.innerHTML='';
 if(!list.length){
   body.innerHTML='<tr><td colspan="'+(7+range.days)+'" class="empty">Nenhuma tarefa encontrada.</td></tr>';
   updateKpis(list);return;
 }
 const statusOptions=['Não iniciada','Em andamento','Concluída','Cancelada'];
 list.forEach(t=>{
  const tr=document.createElement('tr');tr.dataset.id=t.id;
  if(isLate(t))tr.classList.add('late-row');
  const start=parseDate(t.start),end=endDate(t);
  const statusClass=t.status==='Concluída'?'done':t.status==='Em andamento'?'progress':t.status==='Cancelada'?'cancel':'todo';
  tr.innerHTML=`
  <td class="sticky-1 col-task">
    <input class="task-input" data-field="name" value="${esc(t.name)}" aria-label="Nome da tarefa">
    ${isLate(t)?'<span class="late-badge">ATRASADA</span>':''}
  </td>
  <td class="sticky-2 col-owner">
    <select class="owner-select" data-field="owner" aria-label="Responsável">
      ${owners().map(o=>`<option value="${esc(o)}" ${t.owner===o?'selected':''}>${esc(o)}</option>`).join('')}
    </select>
  </td>
  <td class="sticky-3 col-status">
    <select class="status-select ${statusClass}" data-field="status" aria-label="Status da tarefa">
      ${statusOptions.map(s=>`<option value="${s}" ${t.status===s?'selected':''}>${s}</option>`).join('')}
    </select>
  </td>
  <td class="sticky-4 col-date"><input type="date" lang="pt-BR" style="width:100%" data-field="start" value="${esc(t.start)}" autocomplete="off" aria-label="Data de início" title="Selecionar data de início"></td>
  <td class="sticky-5 col-days"><input type="number" style="width:100%" min="1" max="3650" data-field="duration" value="${Number(t.duration)||1}" aria-label="Duração"></td>
  <td class="sticky-6 col-end">${fmt(end)}</td>
  <td class="sticky-7 col-actions"><button class="delete" title="Excluir" aria-label="Excluir">×</button></td>`;
  
  const barClass=t.status==='Concluída'?'':t.status==='Em andamento'?'progress-bar':'todo-bar';
  for(let i=0;i<range.days;i++){
    const d=addDays(range.start,i),td=document.createElement('td');
    td.className='day';
    if(d.toDateString()===new Date().toDateString())td.classList.add('today');
    if(start&&end&&d>=start&&d<=end){
      td.classList.add('bar');
      if(barClass)td.classList.add(barClass);
      if(d.toDateString()===start.toDateString())td.classList.add('start');
      if(d.toDateString()===end.toDateString())td.classList.add('finish');
      td.title=`${t.name} • ${fmt(d)} • ${t.status}`;
    }
    tr.appendChild(td);
  }
  body.appendChild(tr);
 });
 updateKpis(list);
 syncStickyWidths();
}

function updateKpis(list){
 document.getElementById('kpiTasks').textContent=list.length;
 const r=dateRange(list);document.getElementById('kpiDays').textContent=r?r.days+' dias':'0 dias';
 document.getElementById('kpiOwners').textContent=new Set(list.filter(t=>t.owner!=='Todos').map(t=>t.owner)).size;
 const done=list.filter(t=>t.status==='Concluída').length;document.getElementById('kpiDone').textContent=list.length?Math.round(done/list.length*100)+'%':'0%';
 document.getElementById('kpiLate').textContent=list.filter(isLate).length;
}

function updateTask(id,field,value,shouldRender=false){
 const t=tasks.find(x=>x.id===id);if(!t)return;
 if(field==='duration')value=Math.max(1,Math.min(3650,parseInt(value,10)||1));
 if(field==='start'){
   const normalized=normalizeStart(value);
   if(!normalized)return;
   value=normalized;
 }
 if(field==='status'){
   if(value==='Concluída')t.progress=100;
   else if(value==='Não iniciada')t.progress=0;
 }
 t[field]=value;
 hasUnsavedChanges=true;
 save();
 if(shouldRender && ['status','start','duration','owner'].includes(field)) render();
}

function addTask(){const base=new Date();tasks.push({id:Date.now(),name:'Nova etapa / tarefa',owner:'Liderança',start:iso(base),duration:5,status:'Não iniciada',progress:0});save();render()}
function deleteTask(id){const t=tasks.find(x=>x.id===id);if(t&&confirm(`Excluir "${t.name}"?`)){tasks=tasks.filter(x=>x.id!==id);save();render()}}

function syncStickyWidths(){
  const table=document.getElementById('ganttTable');
  if(!table)return;
  const row=table.tHead?.rows[0];
  if(!row)return;
  const cells=[...row.children].slice(0,7);
  if(cells.length<7)return;
  const widths=cells.map(c=>Math.ceil(c.getBoundingClientRect().width));
  widths.forEach((w,i)=>table.style.setProperty(`--w${i+1}`,`${w}px`));
}

function fit(){
 const wrap=document.getElementById('ganttWrap'),table=document.getElementById('ganttTable');
 if(!wrap||!table)return;
 zoom=1;
 table.style.zoom=1;
 syncStickyWidths();
 requestAnimationFrame(()=>{
   const natural=table.scrollWidth;
   const available=wrap.clientWidth;
   zoom=Math.max(.45,Math.min(1,available/natural));
   applyZoom();
   requestAnimationFrame(syncStickyWidths);
 });
}
function applyZoom(){document.getElementById('ganttTable').style.zoom=zoom;document.getElementById('zoomInfo').textContent=Math.round(zoom*100)+'%'}

function exportExcel() {
  if (typeof XLSX === 'undefined') {
    alert('Biblioteca XLSX indisponível.');
    return;
  }

  const list = filtered();
  const range = dateRange(list) || { start: new Date(), days: 30 };
  const wb = XLSX.utils.book_new();

  const infoData = list.map(t => ({
    'Tarefa': t.name,
    'Responsável': t.owner,
    'Status': t.status,
    'Início': t.start,
    'Duração (Dias)': t.duration,
    'Fim': fmt(endDate(t)),
    'Atrasada': isLate(t) ? 'Sim' : 'Não'
  }));
  const wsInfo = XLSX.utils.json_to_sheet(infoData);
  wsInfo['!cols'] = [
    { wch: 35 }, { wch: 18 }, { wch: 16 }, 
    { wch: 12 }, { wch: 14 }, { wch: 12 }, { wch: 10 }
  ];
  XLSX.utils.book_append_sheet(wb, wsInfo, 'Informações');

  const fixedHeaders = ['Tarefa', 'Responsável', 'Status', 'Início', 'Dias', 'Fim'];
  const dateHeaders = Array.from({ length: range.days }, (_, i) => fmt(addDays(range.start, i)));

  const ganttRows = [[...fixedHeaders, ...dateHeaders]];

  list.forEach(t => {
    ganttRows.push([
      t.name, t.owner, t.status, t.start, t.duration, fmt(endDate(t)),
      ...Array.from({ length: range.days }, () => '')
    ]);
  });

  const wsGantt = XLSX.utils.aoa_to_sheet(ganttRows);

  const colWidths = [
    { wch: 30 }, { wch: 15 }, { wch: 14 }, { wch: 12 }, { wch: 8 }, { wch: 12 }
  ];

  for (let i = 0; i < range.days; i++) {
    colWidths.push({ wch: 9.75 });
  }
  wsGantt['!cols'] = colWidths;

  list.forEach((t, rowIndex) => {
    const tStart = parseDate(t.start);
    const tEnd = endDate(t);
    const excelRowIndex = rowIndex + 2;

    let hexColor = 'FF00FF'; 
    if (t.status === 'Em andamento') hexColor = '4EE1C1'; 
    if (t.status === 'Não iniciada') hexColor = '9BA8B4'; 
    if (t.status === 'Cancelada') hexColor = 'FF5C68'; 

    for (let colIndex = 0; colIndex < range.days; colIndex++) {
      const currentDate = addDays(range.start, colIndex);

      if (tStart && tEnd && currentDate >= tStart && currentDate <= tEnd) {
        const cellAddress = XLSX.utils.encode_cell({ r: excelRowIndex - 1, c: 6 + colIndex });

        if (!wsGantt[cellAddress]) {
          wsGantt[cellAddress] = { v: '', t: 's' };
        }

        wsGantt[cellAddress].s = {
          fill: {
            patternType: 'solid',
            fgColor: { rgb: hexColor }
          },
          border: {
            top: { style: 'thin', color: { rgb: 'CCCCCC' } },
            bottom: { style: 'thin', color: { rgb: 'CCCCCC' } },
            left: { style: 'thin', color: { rgb: 'CCCCCC' } },
            right: { style: 'thin', color: { rgb: 'CCCCCC' } }
          }
        };
      }
    }
  });

  XLSX.utils.book_append_sheet(wb, wsGantt, 'Gantt Visual');
  XLSX.writeFile(wb, 'Blume_Cronograma.xlsx');
}

function exportImage(){
 if(typeof html2canvas==='undefined'){alert('Biblioteca de captura indisponível.');return}
 const btn=document.getElementById('exportImage');
 btn.textContent='Gerando imagem...';btn.disabled=true;
 const table=document.getElementById('ganttTable');
 const savedZoom=zoom;table.style.zoom=1;

 html2canvas(table,{backgroundColor:'#10151b',scale:2,scrollX:0,scrollY:0}).then(canvas=>{
   const link=document.createElement('a');
   link.download='Blume_Cronograma.png';
   link.href=canvas.toDataURL('image/png');
   link.click();
 }).finally(()=>{
   table.style.zoom=savedZoom;
   btn.textContent='Exportar como imagem';btn.disabled=false;
 });
}

function openProjects(){
 const backdrop=document.createElement('div');backdrop.className='modal-backdrop';
 backdrop.innerHTML=`<div class="modal"><h3>Gerenciador de Projetos</h3><div class="project-list">${projects.map(p=>`<div class="project-item ${p.id===activeProject?'active':''}"><span><strong>${esc(p.name)}</strong></span><button class="btn" data-project="${p.id}">Abrir</button></div>`).join('')}</div><button class="btn" id="closeProjects">Fechar</button></div>`;
 document.body.appendChild(backdrop);
 backdrop.querySelector('#closeProjects').onclick=()=>backdrop.remove();
 backdrop.querySelectorAll('[data-project]').forEach(b=>b.onclick=()=>{activeProject=Number(b.dataset.project);backdrop.remove();render()});
}

document.getElementById('addTask').onclick=addTask;
document.getElementById('filterOwner').onchange=render;
document.getElementById('filterStatus').onchange=render;
document.getElementById('projectManager').onclick=openProjects;
document.getElementById('saveNow').onclick=manualSave;
document.getElementById('downloadBackup').onclick=downloadBackup;
document.getElementById('restoreBackup').onclick=()=>document.getElementById('backupFileInput').click();
document.getElementById('backupFileInput').addEventListener('change',e=>{const file=e.target.files?.[0];restoreBackup(file);e.target.value='';});
document.getElementById('reset').onclick=()=>{if(confirm('Restaurar as tarefas padrão?')){tasks=clone(DEFAULT_TASKS);save();renderFilter();render()}};
document.getElementById('fit').onclick=fit;
document.getElementById('zoomIn').onclick=()=>{zoom=Math.min(1.5,zoom+.1);applyZoom()};
document.getElementById('zoomOut').onclick=()=>{zoom=Math.max(.4,zoom-.1);applyZoom()};
document.getElementById('exportExcel').onclick=exportExcel;
document.getElementById('exportImage').onclick=exportImage;

document.getElementById('ganttBody').addEventListener('input',e=>{
 const field=e.target.dataset.field;
 if(!field)return;
 const row=e.target.closest('tr');
 if(!row)return;
 // Salva durante a edição sem reconstruir a tabela.
 if(['name','start','duration'].includes(field)){
   const id=Number(row.dataset.id);
   const task=tasks.find(t=>t.id===id);
   if(!task)return;

   if(field==='duration'){
     const raw=e.target.value;
     const number=raw===''?'':Math.max(1,Math.min(3650,parseInt(raw,10)||1));
     task.duration=number;
     hasUnsavedChanges=true;
     queueSave();
   }else if(field==='name'){
     task.name=e.target.value;
     hasUnsavedChanges=true;
     queueSave();
   }else if(field==='start'){
     const normalized=normalizeStart(e.target.value);
     if(normalized){
       task.start=normalized;
       hasUnsavedChanges=true;
       queueSave();
     }
   }
 }
});
document.getElementById('ganttBody').addEventListener('change',e=>{
 const field=e.target.dataset.field;
 if(!field)return;
 const row=e.target.closest('tr');
 if(!row)return;
 // A data só redesenha o Gantt quando a alteração termina.
 updateTask(Number(row.dataset.id),field,e.target.value,true);
});
document.getElementById('ganttBody').addEventListener('click',e=>{if(e.target.classList.contains('delete'))deleteTask(Number(e.target.closest('tr').dataset.id))});
window.addEventListener('resize',()=>{clearTimeout(window.__fit);window.__fit=setTimeout(()=>{syncStickyWidths();fit()},180)});

// Garante o salvamento quando a página for recarregada, fechada ou abandonada.
window.addEventListener('pagehide',forceSave);
window.addEventListener('beforeunload',forceSave);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')forceSave()});

// Tenta salvar também quando o navegador perde o foco, sem interromper a edição.
window.addEventListener('blur',()=>{if(hasUnsavedChanges)forceSave()});

document.getElementById('todayDisplay').textContent='Hoje: '+new Date().toLocaleDateString('pt-BR');

renderFilter();render();
</script>
</body>
