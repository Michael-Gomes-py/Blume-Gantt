<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Blume Project Management. Cronograma Gantt empresarial.">
<!-- Biblioteca Excel com suporte a estilos e cores -->
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<title>Blume | Gestão de Projetos</title>
<!-- V16: autosave reforçado -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <!-- LOGO EXATO DA IMAGEM EM SVG VETORIAL -->
    <div class="logo-container">
      <svg width="40" height="46" viewBox="0 0 200 230" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Contorno Hexagonal Externo -->
        <polygon points="100,5 190,57 190,163 100,215 10,163 10,57" stroke="#FF00FF" stroke-width="14" stroke-linejoin="round" fill="none"/>
        
        <!-- Y Central Interno -->
        <line x1="100" y1="110" x2="100" y2="215" stroke="#FF00FF" stroke-width="14" stroke-linecap="round"/>
        <line x1="100" y1="110" x2="10" y2="57" stroke="#FF00FF" stroke-width="14" stroke-linecap="round"/>
        <line x1="100" y1="110" x2="190" y2="57" stroke="#FF00FF" stroke-width="14" stroke-linecap="round"/>
        
        <!-- Bloco Cubo Superior (Seta Superior) -->
        <polyline points="55,31 100,57 145,31" stroke="#FF00FF" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
        
        <!-- Bloco Cubo Esquerdo -->
        <polyline points="10,110 55,136 55,189" stroke="#FF00FF" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
        
        <!-- Bloco Cubo Direito -->
        <polyline points="190,110 145,136 145,189" stroke="#FF00FF" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
      </svg>
    </div>
    <div>
      <h1>B L U M E</h1>
      <p>Project Management System</p>
    </div>
  </div>
  <div class="status" id="saveStatus">● Dados sincronizados</div>
</header>

<main>
  <section class="hero">
    <div><h2>Gestão de Projetos</h2><p>Cronograma Gantt empresarial responsivo e integrado.</p></div>
    <div class="status" id="todayDisplay"></div>
  </section>

  <section class="kpis">
    <div class="card kpi"><small>Tarefas</small><strong id="kpiTasks">0</strong></div>
    <div class="card kpi"><small>Período</small><strong id="kpiDays">0 dias</strong></div>
    <div class="card kpi"><small>Responsáveis</small><strong id="kpiOwners">0</strong></div>
    <div class="card kpi"><small>Concluídas</small><strong id="kpiDone">0%</strong></div>
    <div class="card kpi"><small>Atrasadas</small><strong id="kpiLate">0</strong></div>
  </section>

  <section class="card toolbar">
    <div class="group">
      <button class="btn primary" id="addTask">＋ Nova tarefa</button>
      <label for="filterOwner">Responsável</label>
      <select id="filterOwner"></select>
      <label for="filterStatus">Status</label>
      <select id="filterStatus">
        <option value="TODOS">Todos</option>
        <option value="Não iniciada">Não iniciada</option>
        <option value="Em andamento">Em andamento</option>
        <option value="Concluída">Concluída</option>
        <option value="Cancelada">Cancelada</option>
      </select>
    </div>
    <div class="group">
      <button class="btn" id="fit">Ajustar ao tamanho</button>
      <button class="btn" id="zoomOut">−</button><span class="zoom-info" id="zoomInfo">100%</span><button class="btn" id="zoomIn">＋</button>
      <button class="btn" id="profileManager">👤 Perfil: <span id="profileName">Meu perfil</span></button>
      <button class="btn" id="projectManager">📁 Projetos</button>
      <button class="btn primary" id="saveNow">💾 Salvar agora</button>
      <button class="btn" id="downloadBackup">⬇ Backup do perfil</button>
      <button class="btn" id="restoreBackup">⬆ Restaurar perfil</button>
      <input type="file" id="backupFileInput" accept="application/json,.json" hidden>
      <button class="btn" id="exportExcel">Excel (.xlsx)</button>
      <button class="btn" id="exportImage">Exportar como imagem</button>
      <button class="btn danger" id="reset">Restaurar</button>
    </div>
  </section>

  <section class="card gantt-card">
    <div class="gantt-wrap" id="ganttWrap">
      <table id="ganttTable">
        <thead><tr id="ganttHead">
          <th class="sticky-1 col-task">Etapa / Tarefa</th>
          <th class="sticky-2 col-owner">Responsável</th>
          <th class="sticky-3 col-status">Status</th>
          <th class="sticky-4 col-date">Início</th>
          <th class="sticky-5 col-days">Dias</th>
          <th class="sticky-6 col-end">Fim</th>
          <th class="sticky-7 col-actions">Ações</th>
        </tr></thead>
        <tbody id="ganttBody"></tbody>
      </table>
    </div>
  </section>
  <div class="footer">BLUME • Gestão de Projetos Avançada</div>
</main>

<script src="js/app.js"></script>
</body>
</html>
